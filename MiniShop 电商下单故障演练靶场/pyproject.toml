[project]
name = "minishop-fault-lab"
version = "0.1.0"
description = "MiniShop checkout fault lab for DevOps RCA Agent demos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "httpx>=0.27,<1.0",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.22",
  "prometheus-client>=0.17",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3; python_version >= '3.10'",
  "pytest>=7.0",
  "ruff==0.15.22",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
