name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run python scripts/check-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Build release package
        if: startsWith(github.ref, 'refs/tags/')
        run: uv build --out-dir dist
      - name: Validate release package
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          uv run python scripts/check-release-version.py
          --tag "${GITHUB_REF_NAME}" --dist-dir dist
      - name: Lint
        run: uv run ruff check .
      - name: Unit and API tests
        run: uv run pytest -q -m "not live"
      - name: Install MiniShop
        working-directory: MiniShop 电商下单故障演练靶场
        run: uv sync --locked --extra dev
      - name: Test MiniShop
        working-directory: MiniShop 电商下单故障演练靶场
        run: uv run pytest
      - name: Alembic offline migration check
        env:
          DEVOPS_AGENT_DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/devops_agent
        run: uv run alembic upgrade head --sql > alembic-upgrade.sql
      - name: Stage release package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t devops-agent-platform:${{ github.sha }} .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: devops-agent-platform:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Report all high and critical vulnerabilities
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devops-agent-platform:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Block fixable high and critical vulnerabilities
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devops-agent-platform:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test
      - image
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download validated release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-release-${{ github.sha }}
          path: dist
      - name: Revalidate release package
        run: >-
          python scripts/check-release-version.py
          --tag "${GITHUB_REF_NAME}" --dist-dir dist
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish-github-release.py
          --tag "${GITHUB_REF_NAME}" --dist-dir dist
          --repository "${GITHUB_REPOSITORY}"
