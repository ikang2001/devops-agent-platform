name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run python scripts/check-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Build release package
        if: startsWith(github.ref, 'refs/tags/')
        run: uv build --out-dir dist
      - name: Validate release package
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          uv run python scripts/check-release-version.py
          --tag "${GITHUB_REF_NAME}" --dist-dir dist
      - name: Lint
        run: uv run ruff check .
      - name: Unit and API tests
        run: uv run python -m pytest -q -m "not live"
      - name: Install MiniShop
        working-directory: MiniShop 电商下单故障演练靶场
        run: uv sync --locked --extra dev
      - name: Test MiniShop
        working-directory: MiniShop 电商下单故障演练靶场
        run: uv run python -m pytest
      - name: Alembic offline migration check
        env:
          DEVOPS_AGENT_DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/devops_agent
        run: uv run alembic upgrade head --sql > alembic-upgrade.sql
      - name: Stage release package
        if: startsWith(github.ref, 'refs/tags/')
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0

  python-311-compatibility:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      # v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Unit and API tests
        run: uv run python -m pytest -q -m "not live"
      - name: Alembic offline migration check
        env:
          DEVOPS_AGENT_DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/devops_agent
        run: uv run alembic upgrade head --sql > alembic-upgrade-py311.sql

  security:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Export locked production dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/root-requirements.txt"
          uv export --directory "MiniShop 电商下单故障演练靶场" --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/minishop-requirements.txt"
      - name: Audit platform dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --strict --requirement "${RUNNER_TEMP}/root-requirements.txt"
      - name: Audit MiniShop dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --strict --requirement "${RUNNER_TEMP}/minishop-requirements.txt"
      - name: Scan tracked files for secrets
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

  image:
    runs-on: ubuntu-latest
    needs:
      - test
      - python-311-compatibility
      - security
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t devops-agent-platform:${{ github.sha }} .
      - name: Generate SBOM
        # v0.24.0
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: devops-agent-platform:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Report all high and critical vulnerabilities
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devops-agent-platform:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Block fixable high and critical vulnerabilities
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devops-agent-platform:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test
      - image
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Download validated release package
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-release-${{ github.sha }}
          path: dist
      - name: Download image SBOM
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image-sbom-${{ github.sha }}
          path: release-metadata
      - name: Revalidate release package
        run: >-
          python scripts/check-release-version.py
          --tag "${GITHUB_REF_NAME}" --dist-dir dist
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish-github-release.py
          --tag "${GITHUB_REF_NAME}" --dist-dir dist
          --sbom-path "release-metadata/sbom.spdx.json"
          --repository "${GITHUB_REPOSITORY}"
