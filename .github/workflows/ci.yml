name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit and API tests
        run: uv run pytest -q -m "not live"
      - name: Install MiniShop
        working-directory: MiniShop 电商下单故障演练靶场
        run: uv sync --locked --extra dev
      - name: Test MiniShop
        working-directory: MiniShop 电商下单故障演练靶场
        run: uv run pytest
      - name: Alembic offline migration check
        env:
          DEVOPS_AGENT_DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/devops_agent
        run: uv run alembic upgrade head --sql > alembic-upgrade.sql

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devops-agent-platform:${{ github.sha }} .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: devops-agent-platform:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Report all high and critical vulnerabilities
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devops-agent-platform:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Block fixable high and critical vulnerabilities
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devops-agent-platform:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"
