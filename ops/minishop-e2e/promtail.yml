server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: minishop
    static_configs:
      - targets: [localhost]
        labels:
          job: minishop
          __path__: /var/log/minishop/*.log
    pipeline_stages:
      - json:
          expressions:
            tenant_id: tenant_id
            service: service_name
            service_name: service_name
            level: level
            trace_id: trace_id
      - labels:
          tenant_id:
          service:
          service_name:
          level:
          trace_id:
