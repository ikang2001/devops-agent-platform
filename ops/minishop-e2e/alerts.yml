groups:
  - name: minishop-e2e
    rules:
      - alert: MiniShopCheckoutHighLatency
        expr: >-
          histogram_quantile(0.95,
          sum(rate(minishop_http_request_duration_seconds_bucket{
          service_name="checkout-service",endpoint="/checkout"}[30s])) by (le)) > 1
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: checkout-service
        annotations:
          summary: checkout-service p95 latency is higher than 1s

      - alert: MiniShopPayment5xxSpike
        expr: increase(minishop_payment_error_total[30s]) > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: payment-service
        annotations:
          summary: payment-service 5xx errors are increasing

      - alert: MiniShopPaymentDeploymentRegression
        expr: increase(minishop_payment_deployment_regression_total[30s]) > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: payment-service
        annotations:
          summary: payment-service errors increased after the v2 deployment

      - alert: MiniShopInventoryDbTimeout
        expr: increase(minishop_inventory_db_timeout_total[30s]) > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: inventory-service
        annotations:
          summary: inventory-service database timeout detected

      - alert: MiniShopPaymentConfigRegression
        expr: minishop_fault_enabled{service_name="payment-service",fault_type="config_regression"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: payment-service
        annotations:
          summary: payment-service configuration regression

      - alert: MiniShopInventoryRedisLatency
        expr: minishop_fault_enabled{service_name="inventory-service",fault_type="redis_latency"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: inventory-service
        annotations:
          summary: inventory Redis latency is high

      - alert: MiniShopCheckoutPoolExhaustion
        expr: minishop_fault_enabled{service_name="checkout-service",fault_type="connection_pool_exhaustion"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: checkout-service
        annotations:
          summary: checkout connection pool exhausted

      - alert: MiniShopPaymentProviderTimeout
        expr: minishop_fault_enabled{service_name="payment-service",fault_type="third_party_api_timeout"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: payment-service
        annotations:
          summary: payment provider timeout

      - alert: MiniShopCheckoutCascade
        expr: minishop_fault_enabled{service_name="checkout-service",fault_type="cascading_failure"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: checkout-service
        annotations:
          summary: checkout downstream cascade

      - alert: MiniShopKnownPaymentError
        expr: minishop_fault_enabled{service_name="payment-service",fault_type="known_error_repeat"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: payment-service
        annotations:
          summary: known payment error repeated

      - alert: MiniShopMisleadingPaymentHistory
        expr: minishop_fault_enabled{service_name="payment-service",fault_type="misleading_history"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: payment-service
        annotations:
          summary: payment incident resembles old provider timeout

      - alert: MiniShopFalsePositiveCheckout
        expr: minishop_fault_enabled{service_name="checkout-service",fault_type="false_positive_alert"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: checkout-service
        annotations:
          summary: checkout alert with no customer impact

      - alert: HoldoutCrossZoneNetworkAlertNoImpact
        expr: minishop_holdout_fault_enabled{service_name="shipping-quote-api",fault_type="network_alert_no_impact"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: shipping-quote-api
        annotations:
          summary: shipping-quote-api operational anomaly requires investigation

      - alert: HoldoutDnsResolutionFailure
        expr: minishop_holdout_fault_enabled{service_name="pricing-api",fault_type="dns_failure"} > 0
        for: 2s
        labels:
          severity: P1
          tenant_id: demo
          service_name: pricing-api
        annotations:
          summary: pricing-api operational anomaly requires investigation

      - alert: HoldoutElasticsearchQueryLatency
        expr: minishop_holdout_fault_enabled{service_name="catalog-search-api",fault_type="query_latency"} > 0
