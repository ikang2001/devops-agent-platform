services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devops_agent
      POSTGRES_PASSWORD: devops_agent
      POSTGRES_DB: devops_agent
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U devops_agent -d devops_agent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - ${STEP4_ACCEPTANCE_DATA_ROOT:-./.tmp/step4-acceptance-data}/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

  http-sandbox:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/mock_http.py"]
    volumes:
      - ./mock_http.py:/app/mock_http.py:ro
    ports:
      - "18080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
