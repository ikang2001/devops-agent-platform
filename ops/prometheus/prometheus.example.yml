# 本文件展示容器环境下的最小Prometheus装配。
# 生产环境应通过服务发现替换静态targets，并在入口层限制/metrics访问范围。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/devops-agent-recording.yml
  - /etc/prometheus/rules/devops-agent-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: devops-agent-platform
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - devops-agent-platform:8000
