apiVersion: v1
kind: Secret
metadata:
  name: devops-agent-platform-secret
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: devops-agent-platform
type: Opaque
stringData:
  DEVOPS_AGENT_DATABASE_URL: "postgresql+psycopg://user:password@postgres.example.internal:5432/devops_agent"
  DEVOPS_AGENT_ALERT_WEBHOOK_SECRET: "replace-with-secret-manager-value-32-bytes"
  DEVOPS_AGENT_KAFKA_BOOTSTRAP_SERVERS: "kafka-1.example.internal:9093,kafka-2.example.internal:9093"
  DEVOPS_AGENT_KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  DEVOPS_AGENT_KAFKA_SASL_USERNAME: "devops-agent"
  DEVOPS_AGENT_KAFKA_SASL_PASSWORD: "replace-with-secret-manager-value"
  DEVOPS_AGENT_PROMETHEUS_BASE_URL: "https://prometheus.example.internal"
  DEVOPS_AGENT_LOKI_BASE_URL: "https://loki.example.internal"
  DEVOPS_AGENT_TEMPO_BASE_URL: "https://tempo.example.internal"
  DEVOPS_AGENT_LLM_OPENAI_API_KEY: "replace-with-secret-manager-value"
  DEVOPS_AGENT_LLM_DASHSCOPE_API_KEY: "replace-with-secret-manager-value"
  DEVOPS_AGENT_ADMIN_OIDC_ISSUER: "https://identity.example.com/"
  DEVOPS_AGENT_ADMIN_OIDC_AUDIENCE: "devops-agent-api"
  DEVOPS_AGENT_ADMIN_OIDC_JWKS_URL: "https://identity.example.com/.well-known/jwks.json"
