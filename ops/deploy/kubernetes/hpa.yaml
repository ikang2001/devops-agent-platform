apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-agent-platform
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: devops-agent-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-agent-platform
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
