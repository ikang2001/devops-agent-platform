apiVersion: batch/v1
kind: Job
metadata:
  name: devops-agent-platform-migrate
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: devops-agent-platform
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-agent-platform
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: devops-agent-platform
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: registry.example.com/devops-agent-platform:0.3.1
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: devops-agent-platform-config
            - secretRef:
                name: devops-agent-platform-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
