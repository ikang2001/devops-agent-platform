[project]
name = "devops-agent-platform"
version = "0.5.0"
description = "Production-oriented DevOps troubleshooting Agent platform."
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.14.0,<0.15.0",
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0,<1.0.0",
    "prometheus-client>=0.25.0,<0.26.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT[crypto]>=2.10.0,<3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "hypothesis>=6.0.0,<7.0.0",
    "httpx2>=2.0.0,<3.0.0",
    "PyYAML>=6.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.15.22",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devops_agent_platform.interfaces.http" = ["static/ops-console/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires explicitly configured real external services",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
